# Publica o app no GitHub Pages a cada push na branch main.
# Antes de publicar roda os testes que não precisam de nada instalado (só o Node);
# se algum falhar, a versão com problema NÃO vai ao ar.
#
# Uma vez só, no repositório: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; a que já está rodando termina antes da próxima
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Testes unitários (lógica de horários, Web Push, função de lembretes)
        run: node --test test/due.test.mjs test/webpush.test.mjs test/handler.test.mjs test/logic.test.mjs
      - name: Build (gera o service worker com a versão do cache)
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
